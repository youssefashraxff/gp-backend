name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Schema check (generated types match pinned schemas)
        run: |
          bash scripts/generate_types.sh
          git diff --exit-code -- app/shared/schemas_generated

      - name: Type check
        run: pyright

      - name: Tests
        run: pytest
