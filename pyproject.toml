[project]
name = "gp-backend"
version = "0.1.0"
description = "Concept Development GP backend: FastAPI API process + Temporal worker process"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "temporalio>=1.7",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "supabase>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
  # Pinned so the CI schema check always produces identical output.
  "datamodel-code-generator==0.87.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["schemas", "app/shared/schemas_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
exclude = ["schemas", "app/shared/schemas_generated", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
